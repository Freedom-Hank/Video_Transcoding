services:
  manager:
    build: ./manager
    container_name: manager
    ports:
      - "8080:8080"
    volumes:
      - ./shared-volume:/data
    environment:
      - DATA_DIR=/data
      - HEARTBEAT_TIMEOUT=15
      - HEARTBEAT_FAILURE_THRESHOLD=3
      - SEGMENT_DURATION=10
    networks:
      - transcoding-net
    depends_on:
      - worker-1
      - worker-2
      - worker-3

  worker-1:
    build: ./worker
    container_name: worker-1
    hostname: worker-1
    volumes:
      - ./shared-volume:/data
    environment:
      - WORKER_NAME=worker-1
      - MANAGER_URL=http://manager:8080
      - DATA_DIR=/data
      - POLL_INTERVAL=2
      - HEARTBEAT_INTERVAL=5
    networks:
      - transcoding-net

  worker-2:
    build: ./worker
    container_name: worker-2
    hostname: worker-2
    volumes:
      - ./shared-volume:/data
    environment:
      - WORKER_NAME=worker-2
      - MANAGER_URL=http://manager:8080
      - DATA_DIR=/data
      - POLL_INTERVAL=2
      - HEARTBEAT_INTERVAL=5
    networks:
      - transcoding-net

  worker-3:
    build: ./worker
    container_name: worker-3
    hostname: worker-3
    volumes:
      - ./shared-volume:/data
    environment:
      - WORKER_NAME=worker-3
      - MANAGER_URL=http://manager:8080
      - DATA_DIR=/data
      - POLL_INTERVAL=2
      - HEARTBEAT_INTERVAL=5
    networks:
      - transcoding-net

networks:
  transcoding-net:
    driver: bridge