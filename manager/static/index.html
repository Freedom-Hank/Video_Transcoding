<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Transcoding Manager</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --queued: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 { font-size: 1.35rem; font-weight: 600; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    section { margin-bottom: 2.5rem; }
    h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .upload-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto;
      gap: 1rem;
      align-items: end;
    }
    @media (max-width: 900px) {
      .upload-form { grid-template-columns: 1fr 1fr; }
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input, select, button {
      font: inherit;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }
    button:hover { filter: brightness(1.1); }
    button.danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
    }
    button.danger:hover { background: rgba(239, 68, 68, 0.15); }
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    @media (max-width: 768px) {
      .nodes-grid { grid-template-columns: 1fr; }
    }
    .node-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .node-name { font-weight: 600; }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-idle .status-dot { background: var(--success); } 
    .status-busy .status-dot { background: var(--danger); }
    .status-suspected .status-dot { background: var(--warning); }
    .status-offline .status-dot { background: var(--danger); }
    .status-offline { color: var(--danger); }
    .metric-bar {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .metric-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .metric-row {
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      color: var(--muted);
    }
    .metric-row span { color: var(--text); float: right; }
    .table-wrap {
      overflow-x: auto;
      margin: -0.25rem;
    }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; white-space: nowrap; }
    td.col-id, td.col-owner { white-space: nowrap; }
    td.col-file {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    td.col-settings { font-size: 0.8rem; line-height: 1.35; }
    .owner-chip {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-queued { background: rgba(99, 102, 241, 0.2); color: var(--queued); }
    .badge-running { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
    .badge-completed { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-failed { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .task-list li {
      margin: 0;
      padding: 2px 0;
      line-height: 1.35;
      word-break: break-word;
    }
    .task-running { color: var(--accent); }
    .tasks-cell {
      max-height: 110px;
      overflow-y: auto;
      padding-right: 6px;
      min-width: 180px;
    }
    .tasks-cell::-webkit-scrollbar { width: 6px; }
    .tasks-cell::-webkit-scrollbar-track { background: transparent; }
    .tasks-cell::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    .tasks-cell::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    .tasks-cell {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .empty { color: var(--muted); text-align: center; padding: 2rem; }
    a.download {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    a.download:hover { text-decoration: underline; }
    .progress-mini {
      display: inline-block;
      width: 48px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .metric-fill.gpu { background: #10b981; }
    .metric-fill.gpu-mem { background: #8b5cf6; }
    .mode-badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    .mode-standard {
      background: rgba(34, 197, 94, 0.18);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.45);
    }
    .mode-worker {
      background: rgba(245, 158, 11, 0.18);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.45);
      animation: pulse-warn 1.6s ease-in-out infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35); }
      50% { box-shadow: 0 0 0 4px rgba(245, 158, 11, 0); }
    }
    .manager-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .manager-card.mode-worker-bg {
      border-color: rgba(245, 158, 11, 0.55);
    }
    .gpu-unavailable {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 0.3rem;
    }
    .stage-progress {
      margin-top: 0.4rem;
      min-width: 180px;
    }
    .stage-label {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .stage-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .stage-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .stage-fill.upload { background: var(--queued); }
    .stage-fill.transcode { background: var(--accent); }
    .stage-fill.merge { background: var(--warning); }
    .stage-fill.indeterminate {
      width: 40% !important;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .duration-pill {
      display: inline-block;
      margin-top: 0.3rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .upload-progress {
      margin-top: 0.85rem;
      display: none;
    }
    .upload-progress.active { display: block; }
    .owner-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .owner-bar input {
      width: auto;
      flex: 0 1 220px;
      padding: 0.3rem 0.55rem;
      font-size: 0.85rem;
    }
    .owner-bar code { color: var(--text); font-size: 0.78rem; }
    .owner-chip {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      font-size: 0.72rem;
      background: rgba(99, 102, 241, 0.18);
      color: var(--queued);
    }
    .owner-chip.mine { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Distributed Video Transcoding</h1>
    <p>Upload videos, monitor parallel segment encoding across worker nodes, and download results.</p>
    <div class="owner-bar">
      <label for="ownerName" style="margin:0">Display name:</label>
      <input type="text" id="ownerName" placeholder="Anonymous" maxlength="64">
      <span>Owner ID: <code id="ownerIdDisplay"></code></span>
    </div>
  </header>

  <main>
    <section>
      <h2>New Job</h2>
      <div class="card">
        <form class="upload-form" id="uploadForm">
          <div>
            <label for="video">Video file</label>
            <input type="file" id="video" name="video" accept="video/*" required>
          </div>
          <div>
            <label for="resolution">Resolution</label>
            <select id="resolution" name="resolution">
              <option value="1920x1080">1920×1080</option>
              <option value="1280x720" selected>1280×720</option>
              <option value="854x480">854×480</option>
              <option value="640x360">640×360</option>
            </select>
          </div>
          <div>
            <label for="format">Format</label>
            <select id="format" name="format">
              <option value="mp4" selected>MP4</option>
              <option value="webm">WebM</option>
              <option value="mkv">MKV</option>
            </select>
          </div>
          <div>
            <label for="bitrate">Bitrate</label>
            <select id="bitrate" name="bitrate">
              <option value="1M">1 Mbps</option>
              <option value="2M" selected>2 Mbps</option>
              <option value="4M">4 Mbps</option>
              <option value="8M">8 Mbps</option>
            </select>
          </div>
          <button type="submit">Submit Job</button>
        </form>
        <div class="upload-progress" id="uploadProgress">
          <div class="stage-label">
            <span>Uploading <span id="uploadFileName"></span></span>
            <span id="uploadPercent">0%</span>
          </div>
          <div class="stage-bar">
            <div class="stage-fill upload" id="uploadFill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>Manager Node</h2>
      <div id="managerCard" class="manager-card">
        <div class="empty" style="padding:0.8rem">Loading manager…</div>
      </div>
    </section>

    <section>
      <h2>Worker Nodes</h2>
      <div class="nodes-grid" id="nodesGrid">
        <div class="empty">Loading nodes…</div>
      </div>
    </section>

    <section>
      <h2>Jobs</h2>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Job ID</th>
                <th>Owner</th>
                <th>File</th>
                <th>Status</th>
                <th>Progress</th>
                <th>Settings</th>
                <th>Tasks</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="jobsBody">
              <tr><td colspan="8" class="empty">No jobs yet</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const POLL_MS = 3000;
    const DEFAULT_CHUNK_SIZE = 50 * 1024 * 1024;

    function getOwnerId() {
      let id = localStorage.getItem('ownerId');
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID()
          : 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, c => {
              const r = Math.random() * 16 | 0;
              return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            }));
        localStorage.setItem('ownerId', id);
      }
      return id;
    }
    function getOwnerName() {
      return (localStorage.getItem('ownerName') || '').trim();
    }
    const OWNER_ID = getOwnerId();
    document.getElementById('ownerIdDisplay').textContent = OWNER_ID.slice(0, 8) + '…';
    const ownerNameInput = document.getElementById('ownerName');
    ownerNameInput.value = getOwnerName();
    ownerNameInput.addEventListener('input', () => {
      localStorage.setItem('ownerName', ownerNameInput.value.trim());
    });

    function authHeaders(extra = {}) {
      return {
        ...extra,
        'X-Owner-Id': OWNER_ID,
        'X-Owner-Name': getOwnerName(),
      };
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type="submit"]');
      const fileInput = form.querySelector('#video');
      const file = fileInput.files[0];
      if (!file) return;

      const progressBox = document.getElementById('uploadProgress');
      const fillEl = document.getElementById('uploadFill');
      const pctEl = document.getElementById('uploadPercent');
      const nameEl = document.getElementById('uploadFileName');

      btn.disabled = true;
      btn.textContent = 'Uploading…';
      nameEl.textContent = `· ${file.name}`;
      fillEl.style.width = '0%';
      pctEl.textContent = '0%';
      progressBox.classList.add('active');

      const setPct = (pct) => {
        fillEl.style.width = pct + '%';
        pctEl.textContent = pct + '%';
      };

      try {
        const meta = {
          filename: file.name,
          total_size: file.size,
          resolution: form.resolution.value,
          format: form.format.value,
          bitrate: form.bitrate.value,
        };
        const initRes = await fetch('/jobs/upload-init', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(meta),
        });
        if (!initRes.ok) {
          const err = await initRes.json().catch(() => ({}));
          throw new Error(err.error || `upload-init failed (${initRes.status})`);
        }
        const { job_id, chunk_size } = await initRes.json();
        const cs = Math.max(1, Number(chunk_size) || DEFAULT_CHUNK_SIZE);
        const total = file.size;
        const totalChunks = Math.ceil(total / cs);

        for (let i = 0; i < totalChunks; i++) {
          const start = i * cs;
          const end = Math.min(start + cs, total);
          const blob = file.slice(start, end);
          await uploadChunkXhr(job_id, i, blob, (loaded) => {
            const overall = Math.round(((start + loaded) / total) * 100);
            setPct(Math.min(99, overall));
          });
        }

        const finalRes = await fetch(`/jobs/${job_id}/upload-complete`, {
          method: 'POST',
          headers: authHeaders(),
        });
        if (!finalRes.ok) {
          const err = await finalRes.json().catch(() => ({}));
          throw new Error(err.error || 'Finalize failed');
        }
        setPct(100);
        form.reset();
        await refresh();
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Job';
        setTimeout(() => progressBox.classList.remove('active'), 600);
      }
    });

    function uploadChunkXhr(jobId, index, blob, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `/jobs/${jobId}/chunks/${index}`);
        xhr.setRequestHeader('X-Owner-Id', OWNER_ID);
        xhr.setRequestHeader('X-Owner-Name', getOwnerName());
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.upload.addEventListener('progress', (evt) => {
          if (evt.lengthComputable) onProgress(evt.loaded);
        });
        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve();
          } else {
            let msg = `chunk ${index} failed (${xhr.status})`;
            try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
            reject(new Error(msg));
          }
        });
        xhr.addEventListener('error', () => reject(new Error(`chunk ${index} network error`)));
        xhr.addEventListener('abort', () => reject(new Error(`chunk ${index} aborted`)));
        xhr.send(blob);
      });
    }

    async function refresh() {
      await Promise.all([loadManager(), loadNodes(), loadJobs()]);
    }

    async function loadManager() {
      const card = document.getElementById('managerCard');
      try {
        const res = await fetch('/manager/info');
        if (!res.ok) {
          card.innerHTML = '<div class="empty" style="padding:0.8rem">Manager info unavailable</div>';
          return;
        }
        const m = await res.json();
        const mode = (m.mode === 'worker') ? 'worker' : 'standard';
        const modeLabel = (mode === 'worker') ? 'Worker Mode' : 'Standard Mode';
        const gpuPct = Number(m.gpu_percent || 0);
        const gpuMemUsed = Number(m.gpu_memory_used_mb || 0);
        const gpuMemTotal = Number(m.gpu_memory_total_mb || 0);
        const gpuMemPct = Number(m.gpu_memory_percent || 0);
        const gpuName = m.gpu_name ? ` · ${escapeHtml(m.gpu_name)}` : '';
        const gpuHtml = m.gpu_available
          ? `
            <div class="metric-row">
              GPU${gpuName} <span>${gpuPct.toFixed(1)}%</span>
              <div class="metric-bar"><div class="metric-fill gpu" style="width:${Math.min(100, gpuPct)}%"></div></div>
            </div>
            <div class="metric-row">
              GPU Mem <span>${gpuMemUsed.toFixed(0)} / ${gpuMemTotal.toFixed(0)} MiB (${gpuMemPct.toFixed(1)}%)</span>
              <div class="metric-bar"><div class="metric-fill gpu-mem" style="width:${Math.min(100, gpuMemPct)}%"></div></div>
            </div>`
          : '<div class="gpu-unavailable">GPU: not available</div>';

        card.className = 'manager-card' + (mode === 'worker' ? ' mode-worker-bg' : '');
        card.innerHTML = `
          <div class="node-header">
            <span class="node-name">manager
              <span class="mode-badge mode-${mode}">${modeLabel}</span>
            </span>
            <span class="status-label" title="${escapeHtml(m.current_task_id || 'idle')}">
              ${m.current_task_id ? 'Encoding: <code>' + escapeHtml(m.current_task_id) + '</code>' : 'No task'}
            </span>
          </div>
          <div class="metric-row">
            CPU <span>${Number(m.cpu_percent || 0).toFixed(1)}%</span>
            <div class="metric-bar"><div class="metric-fill" style="width:${Math.min(100, m.cpu_percent || 0)}%"></div></div>
          </div>
          <div class="metric-row">
            Memory <span>${Number(m.memory_used_mb || 0).toFixed(0)} / ${Number(m.memory_total_mb || 0).toFixed(0)} MiB (${Number(m.memory_percent || 0).toFixed(1)}%)</span>
            <div class="metric-bar"><div class="metric-fill" style="width:${Math.min(100, m.memory_percent || 0)}%"></div></div>
          </div>
          ${gpuHtml}
        `;
      } catch (err) {
        card.innerHTML = '<div class="empty" style="padding:0.8rem">Failed to load manager info</div>';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    async function loadNodes() {
      const grid = document.getElementById('nodesGrid');
      try {
        const res = await fetch('/nodes');
        const nodes = await res.json();
        if (!nodes.length) {
          grid.innerHTML = '<div class="empty">No workers registered</div>';
          return;
        }
        grid.innerHTML = nodes.map(n => {
          const gpuPct = Number(n.gpu_percent || 0);
          const gpuMemUsed = Number(n.gpu_memory_used_mb || 0);
          const gpuMemTotal = Number(n.gpu_memory_total_mb || 0);
          const gpuMemPct = Number(n.gpu_memory_percent || 0);
          const gpuName = n.gpu_name ? ` · ${escapeHtml(n.gpu_name)}` : '';
          const gpuHtml = n.gpu_available
            ? `
              <div class="metric-row">
                GPU${gpuName} <span>${gpuPct.toFixed(1)}%</span>
                <div class="metric-bar"><div class="metric-fill gpu" style="width:${Math.min(100, gpuPct)}%"></div></div>
              </div>
              <div class="metric-row">
                GPU Mem <span>${gpuMemUsed.toFixed(0)} / ${gpuMemTotal.toFixed(0)} MiB (${gpuMemPct.toFixed(1)}%)</span>
                <div class="metric-bar"><div class="metric-fill gpu-mem" style="width:${Math.min(100, gpuMemPct)}%"></div></div>
              </div>`
            : '<div class="gpu-unavailable">GPU: not available</div>';

          return `
          <div class="node-card status-${escapeHtml(n.status)}">
            <div class="node-header">
              <span class="node-name">${escapeHtml(n.name)}</span>
              <span class="status-label">
                <span class="status-dot"></span>${escapeHtml(n.status)}
              </span>
            </div>
            <div class="metric-row">
              CPU <span>${n.cpu_percent.toFixed(1)}%</span>
              <div class="metric-bar"><div class="metric-fill" style="width:${Math.min(100, n.cpu_percent)}%"></div></div>
            </div>
            <div class="metric-row">
              Memory <span>${n.memory_used_mb.toFixed(0)} / ${n.memory_total_mb.toFixed(0)} MiB (${n.memory_percent.toFixed(1)}%)</span>
              <div class="metric-bar"><div class="metric-fill" style="width:${Math.min(100, n.memory_percent)}%"></div></div>
            </div>
            ${gpuHtml}
            ${n.current_task_id ? `<div class="metric-row">Task: <span>${escapeHtml(n.current_task_id)}</span></div>` : ''}
          </div>
        `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="empty">Failed to load nodes</div>';
      }
    }

    function displayStatus(job) {
      if (job.status === 'failed' || job.error) return { label: 'failed', badge: 'failed' };
      if (job.status === 'splitting' || job.status === 'merging') {
        return { label: job.status, badge: 'running' };
      }
      return { label: job.status, badge: job.status };
    }

    function jobProgress(job, tasks) {
      if (job.status === 'completed' && !job.error) return 100;
      if (job.status === 'failed') return 0;
      if (!tasks.length) return job.status === 'queued' ? 0 : '—';
      const total = tasks.reduce((sum, task) => sum + Number(task.progress || 0), 0);
      return Math.round(total / tasks.length);
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return '—';
      const totalSec = Math.round(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    function progressCellHtml(job, tasks) {
      const transcodePct = jobProgress(job, tasks);
      const status = job.status;

      if (status === 'completed' && !job.error) {
        if (job.started_at && job.finished_at) {
          const elapsed = new Date(job.finished_at) - new Date(job.started_at);
          return `<span class="duration-pill">⏱ ${escapeHtml(formatDuration(elapsed))}</span>`;
        }
        return '100%';
      }
      if (status === 'failed') {
        return '<span style="color:var(--danger);font-size:0.8rem">failed</span>';
      }

      if (status === 'uploading') {
        return `
          <div class="stage-progress">
            <div class="stage-label"><span>Uploading…</span><span></span></div>
            <div class="stage-bar"><div class="stage-fill upload indeterminate"></div></div>
          </div>`;
      }
      if (status === 'queued' || status === 'splitting') {
        return `
          <div class="stage-progress">
            <div class="stage-label"><span>${escapeHtml(status === 'queued' ? 'Queued' : 'Splitting…')}</span><span></span></div>
            <div class="stage-bar"><div class="stage-fill transcode indeterminate"></div></div>
          </div>`;
      }
      if (status === 'running') {
        const pct = typeof transcodePct === 'number' ? transcodePct : 0;
        return `
          <div class="stage-progress">
            <div class="stage-label"><span>Transcoding</span><span>${pct}%</span></div>
            <div class="stage-bar"><div class="stage-fill transcode" style="width:${pct}%"></div></div>
          </div>`;
      }
      if (status === 'merging') {
        return `
          <div class="stage-progress">
            <div class="stage-label"><span>Merging…</span><span></span></div>
            <div class="stage-bar"><div class="stage-fill merge indeterminate"></div></div>
          </div>`;
      }
      return typeof transcodePct === 'number' ? transcodePct + '%' : transcodePct;
    }

    async function loadJobs() {
      const tbody = document.getElementById('jobsBody');
      try {
        const listRes = await fetch('/jobs');
        const jobs = await listRes.json();
        if (!jobs.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty">No jobs yet</td></tr>';
          return;
        }

        tbody.innerHTML = jobs.map(job => {
          const tasks = job.tasks || [];
          const progressHtml = progressCellHtml(job, tasks);

          const taskHtml = tasks.length
            ? `<ul class="task-list">${tasks.map(t => {
                const workerName = t.assigned_worker === '__manager__' ? 'manager (helper)' : t.assigned_worker;
                const worker = workerName ? ` → ${escapeHtml(workerName)}` : '';
                const cls = t.status === 'running' ? 'task-running' : '';
                const prog = t.status === 'running' ? ` <span class="progress-mini">${t.progress}%</span>` : '';
                const attempts = t.attempts ? ` · retry ${t.attempts}` : '';
                const first = Number(t.segment_index || 0) + 1;
                const last = first + Number(t.segment_count || 1) - 1;
                const range = first === last ? `${first}` : `${first}-${last}`;
                return `<li class="${cls}">Batch ${Number(t.batch_index || 0) + 1} (segments ${range}): ${escapeHtml(t.status)}${worker}${attempts}${prog}</li>`;
              }).join('')}</ul>`
            : (job.status === 'splitting' ? 'Planning time ranges…' : '—');

          const { label, badge } = displayStatus(job);
          const isMine = job.owner_id && job.owner_id === OWNER_ID;
          let actions = '—';
          if (isMine && (job.status === 'queued' || job.status === 'uploading')) {
            actions = `<button class="danger" data-delete-job="${escapeHtml(job.job_id)}">Delete</button>`;
          } else if (job.status === 'completed' && job.output_path && !job.error) {
            actions = `<a class="download" href="/jobs/${escapeHtml(job.job_id)}/download">Download</a>`;
          } else if (job.error) {
            actions = `<span style="color:var(--danger);font-size:0.8rem">${escapeHtml(job.error)}</span>`;
          }

          const ownerLabel = job.owner_name || (job.owner_id ? job.owner_id.slice(0, 8) + '…' : '—');
          const ownerHtml = job.owner_id
            ? `<span class="owner-chip ${isMine ? 'mine' : ''}">${escapeHtml(ownerLabel)}${isMine ? ' (you)' : ''}</span>`
            : '<span class="owner-chip">—</span>';

          return `
            <tr>
              <td class="col-id"><code>${escapeHtml(job.job_id)}</code></td>
              <td class="col-owner">${ownerHtml}</td>
              <td class="col-file" title="${escapeHtml(job.filename)}">${escapeHtml(job.filename)}</td>
              <td><span class="badge badge-${escapeHtml(badge)}">${escapeHtml(label)}</span></td>
              <td>${progressHtml}</td>
              <td class="col-settings">${escapeHtml(job.resolution)} · ${escapeHtml(job.format)} · ${escapeHtml(job.bitrate)}<br>${Number(job.segment_count || 0)} segments / ${Number(job.task_count || 0)} batches</td>
              <td><div class="tasks-cell">${taskHtml}</div></td>
              <td>${actions}</td>
            </tr>
          `;
        }).join('');

        tbody.querySelectorAll('[data-delete-job]').forEach(btn => {
          btn.addEventListener('click', () => deleteJob(btn.dataset.deleteJob));
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">Failed to load jobs</td></tr>';
      }
    }

    async function deleteJob(jobId) {
      if (!confirm('Delete this queued job?')) return;
      const res = await fetch(`/jobs/${jobId}`, {
        method: 'DELETE',
        headers: authHeaders(),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Delete failed');
        return;
      }
      await refresh();
    }

    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
